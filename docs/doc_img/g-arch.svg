<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 500" width="1130" height="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9854a"/>
    </marker>
  </defs>

  <!-- люди -->
  <rect x="20" y="40" width="230" height="80" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="135" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">Клиент</text>
  <text x="135" y="92" text-anchor="middle" font-size="12" fill="#5b5b50">сайт в браузере</text>
  <text x="135" y="108" text-anchor="middle" font-size="12" fill="#5b5b50">на телефоне или компьютере</text>

  <rect x="20" y="150" width="230" height="80" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="135" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">Менеджер и владелец</text>
  <text x="135" y="202" text-anchor="middle" font-size="12" fill="#5b5b50">админка сайта,</text>
  <text x="135" y="218" text-anchor="middle" font-size="12" fill="#5b5b50">вход с кодом из приложения</text>

  <path d="M250,80 H290 M250,190 H290 M290,80 V190" fill="none" stroke="#a9854a" stroke-width="2"/>
  <path d="M290,118 H358" fill="none" stroke="#a9854a" stroke-width="2" marker-end="url(#a)"/>

  <!-- сервер -->
  <rect x="330" y="20" width="500" height="470" rx="16" fill="#f6f0e3" stroke="#c9a56a" stroke-width="2"/>
  <text x="580" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#2f4a28">Сайт dianthus-opt.ru</text>
  <text x="580" y="70" text-anchor="middle" font-size="12" fill="#5b5b50">арендованный сервер в России</text>

  <rect x="360" y="90" width="440" height="56" rx="10" fill="#fffdf8" stroke="#c9a56a" stroke-width="1.5"/>
  <text x="378" y="113" font-size="14" font-weight="700" fill="#2f4a28">nginx</text>
  <text x="378" y="133" font-size="12" fill="#5b5b50">принимает запросы, шифрует соединение (HTTPS)</text>

  <rect x="360" y="176" width="440" height="70" rx="10" fill="#fffdf8" stroke="#c9a56a" stroke-width="1.5"/>
  <text x="378" y="201" font-size="14" font-weight="700" fill="#2f4a28">Приложение сайта (Python)</text>
  <text x="378" y="223" font-size="12" fill="#5b5b50">каталог, корзина, заказы, счета PDF, админка</text>

  <rect x="360" y="276" width="440" height="60" rx="10" fill="#fffdf8" stroke="#c9a56a" stroke-width="1.5"/>
  <text x="378" y="301" font-size="14" font-weight="700" fill="#2f4a28">База данных PostgreSQL</text>
  <text x="378" y="321" font-size="12" fill="#5b5b50">клиенты, заказы, товары, поставки, журнал действий</text>

  <rect x="360" y="366" width="440" height="52" rx="10" fill="#fffdf8" stroke="#c9a56a" stroke-width="1.5"/>
  <text x="378" y="389" font-size="14" font-weight="700" fill="#2f4a28">Redis</text>
  <text x="378" y="407" font-size="12" fill="#5b5b50">защита от подбора паролей, быстрые счётчики</text>

  <rect x="360" y="432" width="440" height="44" rx="10" fill="#fffdf8" stroke="#c9a56a" stroke-width="1.5"/>
  <text x="378" y="459" font-size="14" font-weight="700" fill="#2f4a28">Фото товаров <tspan font-size="12" font-weight="400" fill="#5b5b50">— папка на сервере</tspan></text>

  <path d="M580,146 V174" fill="none" stroke="#a9854a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M580,246 V274" fill="none" stroke="#a9854a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- 1С, почта, копии -->
  <rect x="880" y="40" width="230" height="70" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="995" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">Оператор 1С</text>
  <text x="995" y="91" text-anchor="middle" font-size="12" fill="#5b5b50">работает в 1С, не на сайте</text>

  <rect x="880" y="140" width="230" height="100" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="995" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">1С</text>
  <text x="995" y="190" text-anchor="middle" font-size="12" fill="#5b5b50">товары, цены, остатки,</text>
  <text x="995" y="206" text-anchor="middle" font-size="12" fill="#5b5b50">накладные (инвойсы),</text>
  <text x="995" y="222" text-anchor="middle" font-size="12" fill="#5b5b50">обработка «ОбменССайтом»</text>

  <path d="M995,110 V138" fill="none" stroke="#a9854a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M878,196 H802" fill="none" stroke="#a9854a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="840" y="186" text-anchor="middle" font-size="10.5" fill="#5b5b50">обмен по ключу</text>

  <rect x="880" y="270" width="230" height="70" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="995" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">Яндекс Почта</text>
  <text x="995" y="321" text-anchor="middle" font-size="12" fill="#5b5b50">письма клиентам и вам</text>
  <path d="M800,226 H848 V305 H878" fill="none" stroke="#a9854a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="880" y="370" width="230" height="100" rx="12" fill="#fffdf8" stroke="#c9a56a" stroke-width="2"/>
  <text x="995" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#2f4a28">Копии базы</text>
  <text x="995" y="420" text-anchor="middle" font-size="12" fill="#5b5b50">каждую ночь на сервере,</text>
  <text x="995" y="436" text-anchor="middle" font-size="12" fill="#5b5b50">каждый день на компьютере</text>
  <text x="995" y="452" text-anchor="middle" font-size="12" fill="#5b5b50">владельца</text>
  <path d="M800,306 H830 V420 H878" fill="none" stroke="#a9854a" stroke-width="2" marker-end="url(#a)"/>
</svg>
