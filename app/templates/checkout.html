{% extends "base.html" %}
{% block content %}
<h1 class="catalog-title mb-4">Оформление</h1>
<div class="card p-4">
    <p class="text-muted">Менеджер свяжется с вами для подтверждения.</p>
    <form action="/place_order" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label class="form-label fw-bold">Комментарий</label>
            <textarea name="comment" class="form-control" rows="3" maxlength="1000" placeholder="Например: нужна досрочная отгрузка"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fas fa-check me-2"></i>Подтвердить заказ</button>
    </form>
</div>
<div class="cart-summary mt-3">
    {% for item in cart %}
    <div class="cart-summary__row">
        <span>{{ item.name }} × {{ item.quantity }}</span>
        <span>{{ "%.0f"|format(item.price * item.quantity) }} ₽</span>
    </div>
    {% endfor %}
    <div class="cart-summary__row cart-summary__row--total">
        <span>Итого:</span><strong>{{ "%.0f"|format(total) }} ₽</strong>
    </div>
</div>
{% endblock %}
