{% extends "base.html" %}
{% set hide_bottom_nav = true %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">
        {% if product %}<i class="fas fa-edit me-2"></i>Редактировать
        {% else %}<i class="fas fa-plus me-2"></i>Новый товар{% endif %}
    </h2>
    <a href="/admin" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Назад</a>
</div>
<form method="post" enctype="multipart/form-data"
      action="{% if product %}/admin/products/{{ product.id }}/edit{% else %}/admin/products/new{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="card p-4">
        <div class="row g-3">
            <div class="col-md-8">
                <div class="mb-3">
                    <label class="form-label fw-bold">Название *</label>
                    <input type="text" name="name" class="form-control" maxlength="200" value="{{ product.name if product else '' }}" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Категория</label>
                        <select name="category" class="form-select">
                            {% for c in categories %}
                                <option value="{{ c }}" {% if product and product.category == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Страна</label>
                        <input type="text" name="country" class="form-control" maxlength="100" value="{{ product.country if product else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Длина, см</label>
                        <input type="number" name="length_cm" class="form-control" min="0" max="500" value="{{ product.length_cm if product else 0 }}">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Единица</label>
                        {% set u = product.unit if product else "упаковка" %}
                        <select name="unit" class="form-select">
                            <option value="упаковка" {% if u == "упаковка" %}selected{% endif %}>упаковка</option>
                            <option value="коробка" {% if u == "коробка" %}selected{% endif %}>коробка</option>
                            <option value="ветка" {% if u == "ветка" %}selected{% endif %}>ветка</option>
                            <option value="пучок" {% if u == "пучок" %}selected{% endif %}>пучок</option>
                            <option value="шт" {% if u == "шт" %}selected{% endif %}>шт</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">В упаковке, шт</label>
                        <input type="number" name="package_size" class="form-control" min="1" max="10000" value="{{ product.package_size if product else 25 }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Мин. заказ, упак.</label>
                        <input type="number" name="min_quantity" class="form-control" min="1" max="10000" value="{{ product.min_quantity if product else 1 }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Описание</label>
                    <textarea name="description" class="form-control" rows="3">{{ product.description if product else '' }}</textarea>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold">Картинка</label>
                <div class="mb-3 text-center">
                    <img id="image-preview" src="{{ product.image_url if product and product.image_url else '' }}"
                         class="img-fluid rounded {% if not product or not product.image_url %}d-none{% endif %}"
                         style="max-height:200px;" alt="">
                </div>
                <div class="mb-3">
                    <input type="file" name="image_file" class="form-control" accept="image/*" onchange="previewImage(this)">
                </div>
                <div class="mb-3">
                    <input type="text" name="image_url" class="form-control" maxlength="500" placeholder="или ссылка" value="{{ product.image_url if product else '' }}">
                </div>
            </div>
        </div>
        <hr>
        <div class="d-flex justify-content-between">
            <a href="/admin" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Сохранить</button>
        </div>
    </div>
</form>
<script>
function previewImage(input) {
    const p = document.getElementById('image-preview');
    if (input.files && input.files[0]) {
        const r = new FileReader();
        r.onload = e => { p.src = e.target.result; p.classList.remove('d-none'); };
        r.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
