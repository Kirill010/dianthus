# ───────────────────────────────────────────────────────────────
# ЭТАП 1: сайт по HTTP (пока нет сертификата).
# Скрипт scripts/prepare.sh копирует этот файл в nginx/conf.d/site.conf,
# подставляя вместо __DOMAIN__ ваш домен.
# После получения сертификата scripts/init-ssl.sh заменит его на site-https.conf.
# ───────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__;

    set $upstream_app http://app:8000;
    proxy_read_timeout 120s;   # для обычных страниц (PDF, экспорт); 1С ниже переопределяет

    # Проверка домена для Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /static/uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Служебный адрес: наружу не отдаём (внутри контейнера он нужен для healthcheck)
    location = /health { 
        return 404; 
    }

    location /api/1c/ {
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ^~ /static/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # Отправка формы входа/регистрации — жёсткий лимит против подбора пароля.
    # GET /login (сама страница) лимитом не ограничивается: ключ зоны пуст.
    location = /login {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # «Забыли пароль» — тот же жёсткий лимит, что и у входа (чтобы не слали письма пачками).
    location = /forgot {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ^~ /reset/ {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # Рекламации: до 8 фото с телефона (каждое до 15 МБ), общий лимит 30 МБ тут мал.
    location = /claims {
        client_max_body_size 128m;
        limit_req zone=posts   burst=30 nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location = /register {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location / {
        limit_req zone=posts   burst=30 nodelay;   # POST: 120/мин + 30 бонусом
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ~ /\.(?!well-known) { 
        deny all; 
    }
}
