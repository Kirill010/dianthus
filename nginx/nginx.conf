user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # Общий лимит тела запроса (загрузка фото товаров, Excel-импорт)
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Лимиты запросов ─────────────────────────────────────────
    # Жёсткий лимит — ТОЛЬКО на отправку форм входа и регистрации
    # (защита от подбора пароля). Пустой ключ = запрос не ограничивается,
    # поэтому открытие страниц /login по GET работает как обычно.
    map "$request_method $request_uri" $auth_limit_key {
        default           "";
        "POST /login"     $binary_remote_addr;
        "POST /register"  $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;

    # Остальные POST (корзина, оформление заказа, профиль) — щедрый лимит.
    # РАНЬШЕ здесь стоял zone=auth (10 запросов в минуту на ЛЮБОЙ POST):
    # активный оптовый клиент, добавляющий товары в корзину, получал 429.
    map $request_method $post_limit_key {
        POST    $binary_remote_addr;
        default "";                      # пустой ключ = без ограничения
    }
    limit_req_zone $post_limit_key zone=posts:20m rate=120r/m;

    # Общий лимит на все запросы с одного адреса.
    limit_req_zone $binary_remote_addr  zone=general:20m rate=20r/s;
    limit_req_status 429;

    # Docker-DNS: имя app перерезолвится, если контейнер пересоздан
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
