# ───────────────────────────────────────────────────────────────
# ЭТАП 2: боевой конфиг с HTTPS.
# Включается скриптом scripts/init-ssl.sh после получения сертификата.
# __DOMAIN__ подставляется автоматически из APP_URL в .env.
# ───────────────────────────────────────────────────────────────

# Неизвестные домены и заходы по голому IP: HTTP → обрываем соединение
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Неизвестные домены по HTTPS: отказ в рукопожатии (сертификат не нужен)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl;
    http2 on;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

# Основной сайт
server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set $upstream_app http://app:8000;
    proxy_read_timeout 120s;   # для обычных страниц (PDF, экспорт); 1С ниже переопределяет

    # Фото товаров отдаёт сам Nginx из общего тома: быстро и без нагрузки на Python
    location ^~ /static/uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Служебный адрес: наружу не отдаём (внутри контейнера он нужен для healthcheck)
    location = /health { 
        return 404; 
    }

    # Обмен с 1С: большие выгрузки, долгие запросы, без общего лимита частоты.
    # Защита — Basic Auth в самом приложении. По желанию ограничьте по IP сервера 1С:
    #   allow 203.0.113.10;   # ← IP вашего сервера 1С
    #   deny  all;
    location /api/1c/ {
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ^~ /static/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # Отправка формы входа/регистрации — жёсткий лимит против подбора пароля.
    # GET /login (сама страница) лимитом не ограничивается: ключ зоны пуст.
    location = /login {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # «Забыли пароль» — тот же жёсткий лимит, что и у входа (чтобы не слали письма пачками).
    location = /forgot {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ^~ /reset/ {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    # Рекламации: до 8 фото с телефона (каждое до 15 МБ), общий лимит 30 МБ тут мал.
    location = /claims {
        client_max_body_size 128m;
        limit_req zone=posts   burst=30 nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location = /register {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location / {
        limit_req zone=posts   burst=30 nodelay;   # POST: 120/мин + 30 бонусом
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/proxy_params.conf;
        proxy_pass $upstream_app;
    }

    location ~ /\.(?!well-known) { 
        deny all; 
    }
}
